name: Audit Capability Map Truth

on:
  push:
    branches:
      - agent/ui-capability-map-convergence

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-capability-map-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact capability truth correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          capability = Path('lib/platform/capabilityMap.ts')
          text = capability.read_text()
          old_reminder = '{ label: "Event reminders", description: "Scheduled reminders through the shared Notifications service.", status: "planned" }'
          new_reminder = '{ label: "Event reminders", description: "Scheduled reminders through the shared Notifications service.", href: "/events/reminders", status: "available" }'
          old_summit = '{ label: "Summit events", description: "Summit experiences represented through the shared Events service.", status: "planned" }'
          new_summit = '{ label: "Summit events", description: "Summit experiences represented through the shared Events service.", href: "/events", status: "available" }'
          assert old_reminder in text, 'unexpected Event reminders catalog state'
          assert old_summit in text, 'unexpected Summit catalog state'
          text = text.replace(old_reminder, new_reminder, 1)
          text = text.replace(old_summit, new_summit, 1)
          capability.write_text(text)

          test = Path('tests/unit/platform-capability-map/capability-map.test.ts')
          source = test.read_text()
          anchor = '''  it("renders links only for Available capabilities", () => {\n    const source = fs.readFileSync(path.join(process.cwd(), "components/explore/CapabilityDirectory.tsx"), "utf8");\n    expect(source).toContain('item.status === "available"');\n    expect(source).toContain("canOpen && item.href");\n  });\n'''
          addition = '''\n  it("keeps shipped Event reminders and Summit experiences discoverable", () => {\n    const events = getCapabilityCatalog({ includeFounder: false }).find((group) => group.id === "events");\n    expect(events?.items.find((item) => item.label === "Event reminders")).toMatchObject({ status: "available", href: "/events/reminders" });\n    expect(events?.items.find((item) => item.label === "Summit events")).toMatchObject({ status: "available", href: "/events" });\n  });\n'''
          assert anchor in source, 'unexpected capability-map test source'
          source = source.replace(anchor, anchor + addition, 1)
          test.write_text(source)
          PY
          npm test -- --run tests/unit/platform-capability-map/capability-map.test.ts
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "playbook-audit-bot"
          git config user.email "playbook-audit-bot@users.noreply.github.com"
          git add lib/platform/capabilityMap.ts tests/unit/platform-capability-map/capability-map.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: align capability map with shipped Events functionality"
          git push origin HEAD:agent/ui-capability-map-convergence
