name: Marketplace Applicant Certification

on:
  pull_request:
    paths:
      - "supabase/migrations/20260818234500_marketplace_applicant_consent_tracking.sql"
      - "supabase/tests/marketplace_applicant_consent_preflight.sql"
      - ".github/workflows/marketplace-applicant-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-applicant-cert-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-marketplace-applicant-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Normalize legacy migration versions locally
        run: node scripts/pbos/prepare-local-supabase-migrations.mjs
      - name: Start isolated local Supabase
        run: supabase start
      - name: Replay full migration chain from zero
        run: supabase db reset --local
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for attempt in 1 2 3; do
            if timeout 120s sudo apt-get -o Acquire::Retries=2 update && timeout 120s sudo apt-get install -y postgresql-client; then
              psql --version
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Certify Marketplace applicant consent and outcome boundary
        run: psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_applicant_consent_preflight.sql
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup