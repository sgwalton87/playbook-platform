name: Database Certification

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-certification.yml"
      - "tests/unit/support-relationships/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-db-cert-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Start isolated local Supabase
        run: supabase start

      - name: Replay full migration chain from zero
        run: supabase db reset --local

      - name: Verify migration history is local only
        run: supabase migration list --local

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Certify relationship authority boundary
        run: psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/relationship_authority_preflight.sql

      - name: Certify invitation authority boundary
        run: psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support_invitation_authority_preflight.sql

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
