      - name: Certify Feed Image Posts media authority
        run: psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/feed_image_posts_media_authority_preflight.sql
      - name: Certify Feed Video Posts media authority
