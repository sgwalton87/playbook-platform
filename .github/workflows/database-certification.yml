      - name: Certify messaging revocation and attachment boundary
        run: psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/messaging_revocation_attachment_preflight.sql
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
