name: Audit Role OS Repair V2

on:
  push:
    branches:
      - agent/audit-role-os-authority-truth

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-role-os-authority-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact audit repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          athlete = Path('app/athlete-abroad-os/page.tsx')
          text = athlete.read_text()
          old = 'import {\n  PlaybookButton,'
          new = 'import AthleteAbroadReadinessGate from "@/components/athlete-abroad/AthleteAbroadReadinessGate";\nimport { CanonicalRoleAuthorityGate } from "@/components/role-os/RoleAuthorityGate";\nimport {\n  PlaybookButton,'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''export default function AthleteAbroadOSPage() {\n  return (\n    <PlaybookPage>'''
          new = '''export default function AthleteAbroadOSPage() {\n  return (\n    <CanonicalRoleAuthorityGate role="athlete-abroad">\n      <AthleteAbroadReadinessGate>\n        <AthleteAbroadWorkspace />\n      </AthleteAbroadReadinessGate>\n    </CanonicalRoleAuthorityGate>\n  );\n}\n\nfunction AthleteAbroadWorkspace() {\n  return (\n    <PlaybookPage>'''
          assert old in text
          text = text.replace(old, new, 1)
          athlete.write_text(text)

          dashboard = Path('components/scholar-athlete/ScholarAthleteDashboard.tsx')
          text = dashboard.read_text()
          old = 'const [eligibilityStatus, setEligibilityStatus] = useState("action_needed");'
          assert old in text
          text = text.replace(old, 'const [eligibilityStatus, setEligibilityStatus] = useState<string | null>(null);\n  const [visitCount, setVisitCount] = useState<number | null>(null);', 1)
          old = '''const [targetResult, dealResult, eligibilityResult] = await Promise.all([\n        supabase.from("recruiting_targets").select("*").eq("scholar_id", auth.user.id),\n        supabase.from("nil_deals").select("*").eq("scholar_id", auth.user.id),\n        supabase.from("athlete_eligibility_checks").select("status").eq("scholar_id", auth.user.id).order("checked_at", { ascending: false }).limit(1),\n      ]);'''
          new = '''const [targetResult, dealResult, eligibilityResult, visitResult] = await Promise.all([\n        supabase.from("recruiting_targets").select("*").eq("scholar_id", auth.user.id),\n        supabase.from("nil_deals").select("*").eq("scholar_id", auth.user.id),\n        supabase.from("athlete_eligibility_checks").select("status").eq("scholar_id", auth.user.id).order("checked_at", { ascending: false }).limit(1),\n        supabase.from("recruiting_visits").select("id").eq("scholar_id", auth.user.id),\n      ]);'''
          assert old in text
          text = text.replace(old, new, 1)
          old = 'if (targetResult.error || dealResult.error || eligibilityResult.error) {'
          assert old in text
          text = text.replace(old, 'if (targetResult.error || dealResult.error || eligibilityResult.error || visitResult.error) {', 1)
          old = 'setEligibilityStatus(eligibilityResult.data?.[0]?.status || "action_needed");'
          assert old in text
          text = text.replace(old, 'setEligibilityStatus(eligibilityResult.data?.[0]?.status || null);\n      setVisitCount((visitResult.data || []).length);', 1)
          old = '''const actions = buildAthleteNextActions({\n    eligibilityStatus,\n    recruitingTargets: recruiting.total,\n    activeDeals: nil.activeDeals,\n    financialPlanComplete: false,\n  });'''
          new = '''const actions = dataState === "ready"\n    ? buildAthleteNextActions({\n        eligibilityStatus,\n        recruitingTargets: recruiting.total,\n        activeDeals: nil.activeDeals,\n        financialPlanComplete: null,\n      })\n    : [];'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''<PlaybookMetric label="Eligibility" value={formatStatus(eligibilityStatus)} />\n          <PlaybookMetric label="Recruiting targets" value={`${recruiting.total} verified`} />\n          <PlaybookMetric label="Campus visits" value={`${recruiting.visits} recorded`} />\n          <PlaybookMetric label="NIL partnerships" value={`${nil.activeDeals} active`} />'''
          new = '''<PlaybookMetric label="Eligibility" value={metricValue(dataState, eligibilityStatus ? formatStatus(eligibilityStatus) : "Not assessed")} />\n          <PlaybookMetric label="Recruiting targets" value={metricValue(dataState, `${recruiting.total} recorded`)} />\n          <PlaybookMetric label="Recruiting visits" value={metricValue(dataState, `${visitCount ?? 0} recorded`)} />\n          <PlaybookMetric label="NIL partnerships" value={metricValue(dataState, `${nil.activeDeals} active`)} />'''
          assert old in text
          text = text.replace(old, new, 1)
          old = 'function formatStatus(value: string) {'
          assert old in text
          text = text.replace(old, 'function metricValue(state: "loading" | "ready" | "error", readyValue: string) {\n  if (state === "loading") return "…";\n  if (state === "error") return "Unavailable";\n  return readyValue;\n}\n\nfunction formatStatus(value: string) {', 1)
          dashboard.write_text(text)

          intelligence = Path('lib/scholar-athlete/athleteIntelligence.ts')
          text = intelligence.read_text()
          assert 'financialPlanComplete: boolean;' in text
          text = text.replace('financialPlanComplete: boolean;', 'financialPlanComplete: boolean | null;', 1)
          assert 'if (input.activeDeals > 0 && !input.financialPlanComplete) {' in text
          text = text.replace('if (input.activeDeals > 0 && !input.financialPlanComplete) {', 'if (input.activeDeals > 0 && input.financialPlanComplete === false) {', 1)
          intelligence.write_text(text)

          Path('tests/role-os-authority-truth.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst read = (file: string) => fs.readFileSync(path.join(process.cwd(), file), "utf8");\n\ndescribe("role OS authority and truth audit", () => {\n  it("gates Scholar, Scholar-Athlete, and Athlete Abroad by canonical role", () => {\n    expect(read("app/dashboard/page.tsx")).toContain('CanonicalRoleAuthorityGate role="scholar"');\n    expect(read("app/scholar-athlete-os/page.tsx")).toContain('CanonicalRoleAuthorityGate role="scholar-athlete"');\n    const athleteAbroad = read("app/athlete-abroad-os/page.tsx");\n    expect(athleteAbroad).toContain('CanonicalRoleAuthorityGate role="athlete-abroad"');\n    expect(athleteAbroad).toContain("<AthleteAbroadReadinessGate>");\n  });\n\n  it("uses canonical recruiting visits instead of deriving visits from target stage", () => {\n    const dashboard = read("components/scholar-athlete/ScholarAthleteDashboard.tsx");\n    expect(dashboard).toContain('from("recruiting_visits").select("id")');\n    expect(dashboard).toContain('label="Recruiting visits"');\n    expect(dashboard).not.toContain('label="Campus visits" value={`${recruiting.visits} recorded`}');\n  });\n\n  it("does not invent financial plan incompletion or unavailable metrics", () => {\n    const dashboard = read("components/scholar-athlete/ScholarAthleteDashboard.tsx");\n    const intelligence = read("lib/scholar-athlete/athleteIntelligence.ts");\n    expect(dashboard).toContain("financialPlanComplete: null");\n    expect(dashboard).toContain('return "Unavailable"');\n    expect(intelligence).toContain("financialPlanComplete: boolean | null");\n    expect(intelligence).toContain("input.financialPlanComplete === false");\n  });\n});\n''')
          PY
          npm test -- --run tests/role-os-authority-truth.test.ts
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "playbook-audit-bot"
          git config user.email "playbook-audit-bot@users.noreply.github.com"
          git add app/athlete-abroad-os/page.tsx components/scholar-athlete/ScholarAthleteDashboard.tsx lib/scholar-athlete/athleteIntelligence.ts tests/role-os-authority-truth.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce role OS authority and canonical metrics"
          git push origin HEAD:agent/audit-role-os-authority-truth
