name: Audit Role Dashboard Metric Truth

on:
  push:
    branches:
      - agent/audit-role-dashboard-metric-truth

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-role-dashboard-metric-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact role dashboard truth repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('lib/role-os/roleDashboards.ts')
          text = dashboard.read_text()
          original = text
          text = re.sub(r'value: "0 (connected|authorized|open|sent|received|scheduled)"', 'value: "Not connected"', text)
          assert text != original, 'expected static pseudo-live role metrics to exist'
          dashboard.write_text(text)

          experience = Path('components/role-os/dashboards/RoleDashboardExperience.tsx')
          source = experience.read_text()
          anchor = '''      <PlaybookMetrics>\n        {dashboard.metrics.map((metric) => (\n          <PlaybookMetric key={metric.label} label={metric.label} value={metric.value} />\n        ))}\n      </PlaybookMetrics>\n'''
          addition = '''      <p role="status" style={metricNotice}>Live role analytics are not connected to a canonical data source yet. Workflow access remains governed by your role and relationships; metrics will not report observed counts until a certified source is connected.</p>\n'''
          assert anchor in source, 'unexpected role dashboard metrics source'
          source = source.replace(anchor, anchor + addition, 1)
          source += '\nconst metricNotice: React.CSSProperties = { maxWidth: 1180, margin: "-8px auto 20px", padding: "12px 14px", borderRadius: 12, background: "#F8FAFC", border: "1px solid #E2E8F0", color: "#64748B", lineHeight: 1.5, fontSize: 12 };\n'
          experience.write_text(source)

          test = Path('tests/unit/role-os/role-dashboard-experience.test.tsx')
          source = test.read_text()
          old = '    expect(serialized).toContain("0 connected");'
          new = '''    expect(serialized).not.toMatch(/0 (connected|authorized|open|sent|received|scheduled)/);\n    expect(serialized).toContain("Not connected");'''
          assert old in source, 'unexpected role-dashboard truth test source'
          source = source.replace(old, new, 1)
          marker = '  it("shared role dashboard component is defined", () => {'
          extra = '''  it("tells users that generic role analytics are not yet connected", () => {\n    const source = fs.readFileSync(path.join(process.cwd(), "components/role-os/dashboards/RoleDashboardExperience.tsx"), "utf8");\n    expect(source).toContain("Live role analytics are not connected to a canonical data source yet");\n    expect(source).toContain('role="status"');\n  });\n\n'''
          assert marker in source
          source = source.replace(marker, extra + marker, 1)
          source = 'import fs from "node:fs";\nimport path from "node:path";\n' + source
          test.write_text(source)
          PY
          npm test -- --run tests/unit/role-os/role-dashboard-experience.test.tsx
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "playbook-audit-bot"
          git config user.email "playbook-audit-bot@users.noreply.github.com"
          git add lib/role-os/roleDashboards.ts components/role-os/dashboards/RoleDashboardExperience.tsx tests/unit/role-os/role-dashboard-experience.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: stop presenting generic OS placeholder metrics as observed data"
          git push origin HEAD:agent/audit-role-dashboard-metric-truth
