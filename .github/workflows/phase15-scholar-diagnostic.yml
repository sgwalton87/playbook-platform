name: Phase 15 Scholar Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  scholar-diagnostic:
    name: Exact trusted Scholar diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://oexgxnybeixwadgtdtzp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_9T3jZbZ_BNUMhkA2jeqxpA__UUAEOue
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PBOS_ACCEPTANCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Publish diagnostic pending status
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=playbook/phase15-scholar-diagnostic -f description="stage:bootstrap"

      - name: Require trusted acceptance configuration
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1

      - name: Run governed Scholar journey
        id: scholar
        continue-on-error: true
        run: npx playwright test tests/acceptance/pbos-scholar.spec.ts --project=chromium

      - name: Publish exact Scholar failure
        if: steps.scholar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY="artifacts/pbos-acceptance/scholar-failure-summary.json"
          if [ -f "$SUMMARY" ]; then
            STAGE=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(x.stage||"unknown").replace(/[^a-zA-Z0-9_.:-]/g,"_").slice(0,80));' "$SUMMARY")
            MESSAGE=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(x.message||"No failure message recorded.").replace(/[\r\n]+/g," ").replace(/\s+/g," ").slice(0,350));' "$SUMMARY")
          else
            STAGE="summary-missing"
            MESSAGE="Scholar failed but the machine-readable failure summary was not produced."
          fi
          DESC="FAILED:Scholar:${STAGE}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=playbook/phase15-scholar-diagnostic -f description="${DESC:0:140}"
          gh issue comment 234 --repo "$GITHUB_REPOSITORY" --body "Phase 15 exact Scholar diagnostic on ${GITHUB_SHA}: **${STAGE}** — ${MESSAGE}"
          exit 1

      - name: Publish Scholar diagnostic success
        if: steps.scholar.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=playbook/phase15-scholar-diagnostic -f description="Scholar trusted journey passed"
          gh issue comment 234 --repo "$GITHUB_REPOSITORY" --body "Phase 15 exact Scholar diagnostic on ${GITHUB_SHA}: **PASS**. Scholar trusted journey completed successfully."

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-exact-scholar-diagnostic-${{ github.sha }}
          path: |
            artifacts/playwright
            artifacts/pbos-acceptance
            /tmp/playbook-next.log
          if-no-files-found: warn
          retention-days: 14
