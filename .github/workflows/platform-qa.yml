name: Platform QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trusted_local_scholar:
        description: Approve synthetic Scholar writes to the disposable localhost stack
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  public-browser-qa:
    name: Public browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export 107-capability uncertified baseline
        run: npx tsx scripts/pbos/export-capability-certification.ts
      - name: Upload governed capability inventory
        uses: actions/upload-artifact@v4
        with:
          name: pbos-capability-ledger-${{ github.sha }}
          path: artifacts/pbos-capability-audit/capabilities.json
          if-no-files-found: error
          retention-days: 30
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          echo $! > /tmp/playbook-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1
      - name: Run desktop tablet mobile accessibility QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/acceptance/phase15-public-platform.spec.ts tests/acceptance/pbos-capability-foundation.spec.ts


  scholar-e2e:
    name: Trusted localhost Scholar QA
    if: github.event_name == 'workflow_dispatch' && inputs.trusted_local_scholar == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PBOS_ALLOW_SYNTHETIC_AUTH_WRITE: "YES"
      PBOS_ACCEPTANCE_COMMIT: ${{ github.sha }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PBOS_QA_MAIL_URL: http://127.0.0.1:54324
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out dispatch SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Install dependencies
        run: npm ci
      - name: Block external SMTP on the disposable runner
        run: |
          set -euo pipefail
          for tool in iptables ip6tables; do
            sudo "$tool" -I OUTPUT 1 ! -o lo -p tcp -m multiport --dports 25,465,587,2525 -j REJECT
            sudo "$tool" -C OUTPUT ! -o lo -p tcp -m multiport --dports 25,465,587,2525 -j REJECT
          done
          sudo iptables -I DOCKER-USER 1 -p tcp -m multiport --dports 25,465,587,2525 -j REJECT
          sudo iptables -C DOCKER-USER -p tcp -m multiport --dports 25,465,587,2525 -j REJECT
      - name: Run exact-SHA Scholar journey and tear down
        run: node scripts/qa/run-trusted-scholar.mjs
      - name: Upload allowlisted Scholar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-local-scholar-${{ github.sha }}
          path: |
            artifacts/trusted-local-scholar/evidence.json
            artifacts/trusted-local-scholar/dashboard.png
          if-no-files-found: warn
          retention-days: 7
