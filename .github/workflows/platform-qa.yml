name: Platform QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-browser-qa:
    name: Public browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          echo $! > /tmp/playbook-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1
      - name: Run desktop tablet mobile accessibility QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/acceptance/phase15-public-platform.spec.ts

  scholar-e2e:
    name: Trusted Scholar + Scholar-Athlete E2E
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PBOS_ACCEPTANCE_EMAIL: ${{ secrets.PBOS_ACCEPTANCE_EMAIL }}
      PBOS_ACCEPTANCE_PASSWORD: ${{ secrets.PBOS_ACCEPTANCE_PASSWORD }}
      PBOS_ACCEPTANCE_ATHLETE_EMAIL: ${{ secrets.PBOS_ACCEPTANCE_ATHLETE_EMAIL }}
      PBOS_ACCEPTANCE_ATHLETE_PASSWORD: ${{ secrets.PBOS_ACCEPTANCE_ATHLETE_PASSWORD }}
      PBOS_ACCEPTANCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Publish role QA pending status
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=playbook/phase15-role-e2e -f description="stage:configuration"
      - name: Require trusted acceptance configuration
        id: configuration
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY PBOS_ACCEPTANCE_EMAIL PBOS_ACCEPTANCE_PASSWORD PBOS_ACCEPTANCE_ATHLETE_EMAIL PBOS_ACCEPTANCE_ATHLETE_PASSWORD; do
            if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "$missing" ]; then echo "Missing required trusted acceptance configuration:$missing"; exit 1; fi
      - name: Publish configuration-ready status
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=playbook/phase15-role-e2e -f description="stage:bootstrap"
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1
      - name: Publish Scholar-running status
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=playbook/phase15-role-e2e -f description="stage:scholar"
      - name: Run governed Scholar journey
        run: npx playwright test tests/acceptance/pbos-scholar.spec.ts --project=chromium
      - name: Publish Scholar-Athlete-running status
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=playbook/phase15-role-e2e -f description="stage:scholar-athlete"
      - name: Run governed Scholar-Athlete journey
        run: npx playwright test tests/acceptance/pbos-scholar-athlete.spec.ts --project=chromium
      - name: Publish role QA success
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=playbook/phase15-role-e2e -f description="Scholar + Scholar-Athlete E2E passed"
      - name: Publish configuration failure
        if: failure() && steps.configuration.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=playbook/phase15-role-e2e -f description="FAILED:trusted acceptance configuration"
      - name: Publish non-configuration failure
        if: failure() && steps.configuration.outcome != 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=playbook/phase15-role-e2e -f description="FAILED:bootstrap or role journey; inspect Actions"
