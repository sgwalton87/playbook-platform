name: Platform QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-qa:
    name: Public browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          echo $! > /tmp/playbook-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1
      - name: Run desktop tablet mobile accessibility QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/acceptance/phase15-public-platform.spec.ts

  scholar-e2e:
    name: Trusted Scholar + Scholar-Athlete E2E
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PBOS_ACCEPTANCE_EMAIL: ${{ secrets.PBOS_ACCEPTANCE_EMAIL }}
      PBOS_ACCEPTANCE_PASSWORD: ${{ secrets.PBOS_ACCEPTANCE_PASSWORD }}
      PBOS_ACCEPTANCE_ATHLETE_EMAIL: ${{ secrets.PBOS_ACCEPTANCE_ATHLETE_EMAIL }}
      PBOS_ACCEPTANCE_ATHLETE_PASSWORD: ${{ secrets.PBOS_ACCEPTANCE_ATHLETE_PASSWORD }}
      PBOS_ACCEPTANCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Require trusted acceptance configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$PBOS_ACCEPTANCE_EMAIL"
          test -n "$PBOS_ACCEPTANCE_PASSWORD"
          test -n "$PBOS_ACCEPTANCE_ATHLETE_EMAIL"
          test -n "$PBOS_ACCEPTANCE_ATHLETE_PASSWORD"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/playbook-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/playbook-next.log
          exit 1
      - name: Run governed Scholar journey
        run: npx playwright test tests/acceptance/pbos-scholar.spec.ts --project=chromium
      - name: Run governed Scholar-Athlete journey
        run: npx playwright test tests/acceptance/pbos-scholar-athlete.spec.ts --project=chromium
