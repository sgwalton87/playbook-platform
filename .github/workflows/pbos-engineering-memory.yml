name: PBOS Engineering Memory
on:
  push:
permissions:
  contents: read
jobs:
  archive:
    if: startsWith(github.event.head_commit.message, 'Milestone:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/pbos-archive-milestone.mjs "${{ github.event.head_commit.message }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbos-engineering-memory-${{ github.sha }}
          path: |
            docs/project-management/milestones/
            docs/project-management/snapshots/
            founders-journal/daily/
