name: Audit Founder Shell Repair

on:
  push:
    branches:
      - agent/audit-founder-shell-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-founder-shell-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact Founder and shell audit repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('lib/auth/platformOperator.ts').write_text('''export const PLATFORM_OPERATOR_ROLES = ["founder", "admin"] as const;\n\nexport function isPlatformOperatorRole(value?: string | null) {\n  const normalized = String(value ?? "").trim().toLowerCase();\n  return PLATFORM_OPERATOR_ROLES.includes(normalized as (typeof PLATFORM_OPERATOR_ROLES)[number]);\n}\n''')

          Path('lib/auth/requirePlatformOperator.ts').write_text('''import { requireUser } from "@/lib/supabase/server";\nimport { isPlatformOperatorRole } from "@/lib/auth/platformOperator";\n\nexport async function requirePlatformOperator() {\n  const { supabase, user } = await requireUser();\n  if (!user) return { authorized: false as const, authenticated: false as const };\n\n  const profile = await supabase.from("profiles").select("role").eq("id", user.id).maybeSingle();\n  if (profile.error || !profile.data || !isPlatformOperatorRole(profile.data.role)) {\n    return { authorized: false as const, authenticated: true as const };\n  }\n\n  return { authorized: true as const, authenticated: true as const };\n}\n''')

          Path('app/founder/layout.tsx').write_text('''import { redirect } from "next/navigation";\nimport { requirePlatformOperator } from "@/lib/auth/requirePlatformOperator";\n\nexport default async function FounderLayout({ children }: { children: React.ReactNode }) {\n  const access = await requirePlatformOperator();\n  if (!access.authenticated) redirect("/login?next=/founder");\n  if (!access.authorized) redirect("/");\n  return <>{children}</>;\n}\n''')

          studio_layout = Path('app/studio/layout.tsx')
          text = studio_layout.read_text()
          expected = '''"use client";\n\nimport StudioShell from "@/components/studio/StudioShell";\n\nexport default function StudioLayout({ children }: { children: React.ReactNode }) {\n  return <StudioShell>{children}</StudioShell>;\n}\n'''
          assert text == expected, 'unexpected Studio layout source'
          studio_layout.write_text('''import { redirect } from "next/navigation";\nimport StudioShell from "@/components/studio/StudioShell";\nimport { requirePlatformOperator } from "@/lib/auth/requirePlatformOperator";\n\nexport default async function StudioLayout({ children }: { children: React.ReactNode }) {\n  const access = await requirePlatformOperator();\n  if (!access.authenticated) redirect("/login?next=/studio");\n  if (!access.authorized) redirect("/");\n  return <StudioShell>{children}</StudioShell>;\n}\n''')

          founder = Path('app/founder/page.tsx')
          text = founder.read_text()
          assert 'label="System Health" value="Green"' in text
          assert 'label="Studio" value="Active"' in text
          assert 'label="Beta 3.4" value="Audit"' in text
          text = text.replace('        <PlaybookMetric label="Studio" value="Active" />\n        <PlaybookMetric label="Beta 3.4" value="Audit" />\n        <PlaybookMetric label="System Health" value="Green" />', '        <PlaybookMetric label="Operator access" value="Verified" />\n        <PlaybookMetric label="System health" value="Not connected" />\n        <PlaybookMetric label="Release status" value="Not connected" />')
          founder.write_text(text)

          status = Path('lib/studio/studioStatus.ts')
          status.write_text('''export function getStudioStatus() {\n  return {\n    version: "Not connected",\n    stage: "Not connected",\n    alphaStatus: "Not connected",\n    betaStatus: "Not connected",\n    build: "Not connected",\n    tests: "Not connected",\n    sentinel: "Not connected",\n    documentation: "Not connected",\n    architecture: "Not connected",\n    sdk: "Not connected",\n    eventBus: "Not connected",\n    latestSprint: "Not connected",\n    latestRelease: "Not connected",\n  };\n}\n''')

          shell = Path('components/shell/UnifiedAppShell.tsx')
          text = shell.read_text()
          route_preview = '''const ROUTE_ROLE_PREVIEWS: Array<[string, string]> = [\n  ["/scholar-athlete-os", "scholar-athlete"], ["/athlete-abroad-os", "athlete-abroad"], ["/brand-partner-os", "brand-partner"],\n  ["/family-os", "family"], ["/mentor-os", "mentor"], ["/educator-os", "educator"], ["/employer-os", "employer"],\n  ["/university-os", "college-admissions"], ["/district-os", "district"],\n];\n'''
          assert route_preview in text
          text = text.replace(route_preview, '')
          import_anchor = 'import { logout } from "@/lib/auth/logout";\n'
          assert import_anchor in text
          text = text.replace(import_anchor, import_anchor + 'import { isPlatformOperatorRole } from "@/lib/auth/platformOperator";\n', 1)
          old = '''  const previewRole = ROUTE_ROLE_PREVIEWS.find(([route]) => pathname === route || pathname?.startsWith(`${route}/`))?.[1];\n  const roleNav = useMemo(() => getRoleNavigation(previewRole || profile?.profile_mode, profile?.role), [previewRole, profile?.profile_mode, profile?.role]);\n  const founderNav = useMemo(() => {\n    const base = getNavigationForRole(profile?.role || profile?.profile_mode || "");\n    return profile?.role === "founder" || profile?.profile_mode === "founder" ? base.founder : [];\n  }, [profile?.role, profile?.profile_mode]);'''
          new = '''  const roleNav = useMemo(() => getRoleNavigation(profile?.profile_mode, profile?.role), [profile?.profile_mode, profile?.role]);\n  const founderNav = useMemo(() => {\n    if (!isPlatformOperatorRole(profile?.role)) return [];\n    return getNavigationForRole(profile?.role).founder;\n  }, [profile?.role]);'''
          assert old in text
          text = text.replace(old, new, 1)
          shell.write_text(text)

          core_nav = Path('lib/core-journey/navigation.ts')
          text = core_nav.read_text()
          assert text.startswith('export const SCHOLAR_PRIMARY_NAV')
          text = 'import { isPlatformOperatorRole } from "@/lib/auth/platformOperator";\n\n' + text
          old = '  if (["founder", "admin", "super_admin"].includes(normalized)) {'
          assert old in text
          text = text.replace(old, '  if (isPlatformOperatorRole(normalized)) {', 1)
          core_nav.write_text(text)

          Path('tests/founder-shell-authority-truth.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\nimport { isPlatformOperatorRole } from "@/lib/auth/platformOperator";\n\nconst read = (file: string) => fs.readFileSync(path.join(process.cwd(), file), "utf8");\n\ndescribe("Founder and shell authority audit", () => {\n  it("uses the same founder/admin operator role contract as the database predicate", () => {\n    expect(isPlatformOperatorRole("founder")).toBe(true);\n    expect(isPlatformOperatorRole("admin")).toBe(true);\n    expect(isPlatformOperatorRole("super_admin")).toBe(false);\n    expect(isPlatformOperatorRole("scholar")).toBe(false);\n  });\n\n  it("server-gates Founder and the entire Studio route tree", () => {\n    expect(read("app/founder/layout.tsx")).toContain("requirePlatformOperator()");\n    expect(read("app/studio/layout.tsx")).toContain("requirePlatformOperator()");\n  });\n\n  it("does not let the URL impersonate another role navigation", () => {\n    const shell = read("components/shell/UnifiedAppShell.tsx");\n    expect(shell).not.toContain("ROUTE_ROLE_PREVIEWS");\n    expect(shell).not.toContain("previewRole");\n    expect(shell).toContain("getRoleNavigation(profile?.profile_mode, profile?.role)");\n    expect(shell).toContain("isPlatformOperatorRole(profile?.role)");\n  });\n\n  it("does not fabricate Founder or Studio operational health", () => {\n    const founder = read("app/founder/page.tsx");\n    const studio = read("lib/studio/studioStatus.ts");\n    expect(founder).not.toContain('value="Green"');\n    expect(founder).not.toContain('value="Active"');\n    expect(studio).not.toContain('build: "Green"');\n    expect(studio).not.toContain('sentinel: "Healthy"');\n    expect(studio).toContain('build: "Not connected"');\n  });\n});\n''')
          PY
          npm test -- --run tests/founder-shell-authority-truth.test.ts
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "playbook-audit-bot"
          git config user.email "playbook-audit-bot@users.noreply.github.com"
          git add lib/auth/platformOperator.ts lib/auth/requirePlatformOperator.ts app/founder/layout.tsx app/studio/layout.tsx app/founder/page.tsx lib/studio/studioStatus.ts components/shell/UnifiedAppShell.tsx lib/core-journey/navigation.ts tests/founder-shell-authority-truth.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "security: fail close Founder Studio and role navigation"
          git push origin HEAD:agent/audit-founder-shell-authority
