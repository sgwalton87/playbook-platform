name: Apply onboarding persistence audit follow-up

on:
  push:
    branches:
      - agent/audit-onboarding-profile-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-onboarding-profile-persistence
          fetch-depth: 0
      - name: Apply follow-up corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/start/page.tsx")
          text = path.read_text()

          old = '''    const { data } = supabase.storage.from("avatars").getPublicUrl(path);\n    update("avatar_url", data.publicUrl);\n    await persist(false, { avatar_url: data.publicUrl });\n  }'''
          new = '''    const { data } = supabase.storage.from("avatars").getPublicUrl(path);\n    update("avatar_url", data.publicUrl);\n    try {\n      await persist(false, { avatar_url: data.publicUrl });\n      lastSavedFormRef.current = JSON.stringify({ ...form, avatar_url: data.publicUrl });\n      setAutosaveStatus("saved");\n    } catch (saveError) {\n      setAutosaveStatus("error");\n      setJourneyError(saveError instanceof Error ? saveError.message : "Your profile photo could not be linked to your Scholar Record.");\n    }\n  }'''
          if old not in text:
              raise SystemExit("Expected onboarding avatar persistence source not found")
          text = text.replace(old, new, 1)

          old = '''  persistRef.current = persist;\n\n  useEffect(() => {'''
          new = '''  useEffect(() => {\n    persistRef.current = persist;\n  });\n\n  useEffect(() => {'''
          if old not in text:
              raise SystemExit("Expected persist ref source not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit follow-up
        shell: bash
        run: |
          if git diff --quiet -- app/start/page.tsx; then exit 0; fi
          git config user.name "playbook-audit-bot"
          git config user.email "playbook-audit-bot@users.noreply.github.com"
          git add app/start/page.tsx
          git commit -m "fix: harden onboarding autosave lifecycle"
          git push origin HEAD:agent/audit-onboarding-profile-persistence
